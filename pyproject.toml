[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tickerrer"
version = "0.1.0"
description = "A reliable historical ticker data downloader for Indexes, Equity, Commodities, ETFs, Forex, Crypto, and CFDs"
readme = "README.md"
authors = [{ name = "Jules" }]
requires-python = ">=3.9"
dependencies = [
    "yfinance>=0.2.30",
    "pandas>=2.0.0",
    "requests>=2.28.0"
]

[project.scripts]
tickerrer = "tickerrer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
